<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yanmar Quiz Arena</title>

  <style>
    :root {
      --yanmar-red: #e30613;
      --dark: #111111;
      --light: #ffffff;
      --soft-grey: #f3f3f3;
      --green: #16a34a;
      --wrong: #dc2626;
      --blue: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ffffff 0%, #eeeeee 55%, #d9d9d9 100%);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .game {
      width: 100%;
      max-width: 980px;
      background: white;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .header {
      background: var(--yanmar-red);
      color: white;
      padding: 22px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .brand p {
      margin: 0;
      font-size: 15px;
      opacity: 0.95;
    }

    .scoreboard {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .score-card {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 16px;
      padding: 10px 14px;
      min-width: 112px;
      text-align: center;
    }

    .score-card strong {
      display: block;
      font-size: 20px;
    }

    .score-card span {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .content {
      padding: 24px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 22px;
      align-items: stretch;
    }

    .question-panel,
    .penalty-panel {
      border-radius: 22px;
      background: var(--soft-grey);
      padding: 22px;
      position: relative;
      overflow: hidden;
    }

    .question-count {
      color: var(--yanmar-red);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .question {
      font-size: clamp(22px, 3.4vw, 34px);
      line-height: 1.12;
      font-weight: 900;
      margin: 0 0 20px;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer-btn {
      border: 2px solid transparent;
      background: white;
      border-radius: 16px;
      padding: 15px 16px;
      text-align: left;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.18s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .answer-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--yanmar-red);
    }

    .answer-btn:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    .answer-btn.correct {
      background: #dcfce7;
      border-color: var(--green);
      color: #14532d;
    }

    .answer-btn.wrong {
      background: #fee2e2;
      border-color: var(--wrong);
      color: #7f1d1d;
    }

    .meta {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .status {
      font-weight: 900;
      font-size: 16px;
    }

    .status.goal {
      color: var(--green);
    }

    .status.miss,
    .status.save {
      color: var(--wrong);
    }

    .next-btn,
    .restart-btn {
      background: var(--dark);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: none;
    }

    .next-btn.show,
    .restart-btn.show {
      display: inline-block;
    }

    .penalty-panel {
      min-height: 430px;
      background:
        radial-gradient(circle at 50% 22%, rgba(255,255,255,0.9), rgba(255,255,255,0.1) 35%),
        linear-gradient(180deg, #b91c1c 0%, #e30613 38%, #f3f3f3 38%, #f3f3f3 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .arena-title {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 10;
      color: white;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }

    .result-banner {
      position: absolute;
      top: 62px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 12px 22px;
      border-radius: 999px;
      background: rgba(255,255,255,0.96);
      color: var(--dark);
      font-size: clamp(24px, 5vw, 46px);
      font-weight: 1000;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .result-banner.show {
      opacity: 1;
      animation: bannerPop 0.45s ease both;
    }

    .result-banner.goal {
      color: var(--green);
    }

    .result-banner.save,
    .result-banner.miss {
      color: var(--wrong);
    }

    @keyframes bannerPop {
      0% {
        opacity: 0;
        transform: translateX(-50%) scale(0.72);
      }
      70% {
        opacity: 1;
        transform: translateX(-50%) scale(1.08);
      }
      100% {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
    }

    .field {
      position: relative;
      height: 350px;
      border-radius: 22px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.16) 1px, transparent 1px),
        linear-gradient(180deg, #15803d 0%, #16a34a 100%);
      background-size: 42px 42px;
      border: 5px solid rgba(255,255,255,0.85);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.2);
    }

    .goal-frame {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      height: 128px;
      border: 8px solid white;
      border-bottom: none;
      border-radius: 10px 10px 0 0;
      z-index: 2;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.08);
      background:
        linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,0.35) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .goal-line {
      position: absolute;
      top: 156px;
      left: 14%;
      width: 72%;
      height: 7px;
      background: white;
      border-radius: 999px;
      z-index: 3;
    }

    .net-label {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      color: rgba(255,255,255,0.7);
      font-size: 44px;
      font-weight: 1000;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .keeper {
      position: absolute;
      top: 126px;
      left: 50%;
      transform: translateX(-50%);
      width: 74px;
      height: 92px;
      z-index: 8;
      transition: 0.4s ease;
    }

    .keeper .head {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #f2c9a5;
      margin: 0 auto -2px;
      border: 3px solid #111;
    }

    .keeper .body {
      width: 54px;
      height: 48px;
      background: var(--blue);
      border: 4px solid #111;
      border-radius: 14px;
      margin: 0 auto;
      position: relative;
    }

    .keeper .body::before,
    .keeper .body::after {
      content: "";
      position: absolute;
      top: 8px;
      width: 35px;
      height: 10px;
      background: var(--blue);
      border: 3px solid #111;
      border-radius: 999px;
    }

    .keeper .body::before {
      left: -34px;
      transform: rotate(-22deg);
    }

    .keeper .body::after {
      right: -34px;
      transform: rotate(22deg);
    }

    .keeper .legs {
      width: 60px;
      height: 24px;
      margin: 0 auto;
      position: relative;
    }

    .keeper .legs::before,
    .keeper .legs::after {
      content: "";
      position: absolute;
      top: -2px;
      width: 12px;
      height: 28px;
      background: #111;
      border-radius: 999px;
    }

    .keeper .legs::before {
      left: 13px;
      transform: rotate(14deg);
    }

    .keeper .legs::after {
      right: 13px;
      transform: rotate(-14deg);
    }

    .keeper.dive-left {
      transform: translateX(-125%) rotate(-34deg);
    }

    .keeper.dive-right {
      transform: translateX(25%) rotate(34deg);
    }

    .keeper.save-center {
      transform: translateX(-50%) translateY(-18px) scale(1.12);
    }

    .ball {
      position: absolute;
      left: 50%;
      bottom: 30px;
      width: 44px;
      height: 44px;
      margin-left: -22px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 32%, #ffffff 0 24%, transparent 25%),
        radial-gradient(circle at 62% 62%, #111 0 16%, transparent 17%),
        radial-gradient(circle at 30% 72%, #111 0 12%, transparent 13%),
        white;
      border: 4px solid #111;
      z-index: 12;
      box-shadow: 0 10px 18px rgba(0,0,0,0.28);
    }

    .ball.goal {
      animation: ballGoal 1.05s cubic-bezier(.2,.7,.2,1) forwards;
    }

    .ball.save {
      animation: ballSave 1.05s cubic-bezier(.2,.7,.2,1) forwards;
    }

    .ball.miss {
      animation: ballMiss 1.05s cubic-bezier(.2,.7,.2,1) forwards;
    }

    @keyframes ballGoal {
      0% {
        left: 50%;
        bottom: 30px;
        transform: scale(1) rotate(0deg);
      }
      65% {
        left: 66%;
        bottom: 190px;
        transform: scale(0.78) rotate(540deg);
      }
      100% {
        left: 70%;
        bottom: 230px;
        transform: scale(0.58) rotate(900deg);
      }
    }

    @keyframes ballSave {
      0% {
        left: 50%;
        bottom: 30px;
        transform: scale(1) rotate(0deg);
      }
      72% {
        left: 50%;
        bottom: 158px;
        transform: scale(0.82) rotate(520deg);
      }
      100% {
        left: 50%;
        bottom: 145px;
        transform: scale(0.82) rotate(580deg);
      }
    }

    @keyframes ballMiss {
      0% {
        left: 50%;
        bottom: 30px;
        transform: scale(1) rotate(0deg);
      }
      70% {
        left: 88%;
        bottom: 205px;
        transform: scale(0.75) rotate(560deg);
      }
      100% {
        left: 106%;
        bottom: 245px;
        transform: scale(0.62) rotate(900deg);
      }
    }

    .net-shake {
      animation: netShake 0.55s ease 0.72s;
    }

    @keyframes netShake {
      0%, 100% {
        transform: translateX(-50%);
      }
      20% {
        transform: translateX(calc(-50% - 8px));
      }
      40% {
        transform: translateX(calc(-50% + 8px));
      }
      60% {
        transform: translateX(calc(-50% - 5px));
      }
      80% {
        transform: translateX(calc(-50% + 5px));
      }
    }

    .shot-line {
      position: absolute;
      left: 50%;
      bottom: 54px;
      width: 4px;
      height: 0;
      background: rgba(255,255,255,0.7);
      transform-origin: bottom;
      z-index: 5;
      opacity: 0;
    }

    .shot-line.goal {
      height: 210px;
      transform: rotate(28deg);
      animation: lineShow 0.45s ease forwards;
    }

    .shot-line.save {
      height: 130px;
      transform: rotate(0deg);
      animation: lineShow 0.45s ease forwards;
    }

    .shot-line.miss {
      height: 245px;
      transform: rotate(48deg);
      animation: lineShow 0.45s ease forwards;
    }

    @keyframes lineShow {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 0.5;
      }
    }

    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 25;
    }

    .confetti.show {
      display: block;
    }

    .confetti span {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 18px;
      background: white;
      animation: confettiFall 1.2s ease forwards;
    }

    .confetti span:nth-child(1) { left: 12%; animation-delay: 0.05s; }
    .confetti span:nth-child(2) { left: 24%; animation-delay: 0.12s; }
    .confetti span:nth-child(3) { left: 37%; animation-delay: 0.02s; }
    .confetti span:nth-child(4) { left: 51%; animation-delay: 0.16s; }
    .confetti span:nth-child(5) { left: 63%; animation-delay: 0.08s; }
    .confetti span:nth-child(6) { left: 76%; animation-delay: 0.18s; }
    .confetti span:nth-child(7) { left: 88%; animation-delay: 0.10s; }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(330px) rotate(420deg);
        opacity: 0;
      }
    }

    .final-screen {
      display: none;
      padding: 28px;
      text-align: center;
    }

    .final-screen.show {
      display: block;
    }

    .final-screen h2 {
      font-size: clamp(32px, 6vw, 56px);
      margin: 0 0 12px;
      color: var(--yanmar-red);
      text-transform: uppercase;
    }

    .final-screen p {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 760px) {
      body {
        padding: 10px;
        align-items: flex-start;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .scoreboard {
        width: 100%;
        justify-content: space-between;
      }

      .score-card {
        flex: 1;
        min-width: 95px;
      }

      .content {
        grid-template-columns: 1fr;
        padding: 14px;
        gap: 14px;
      }

      .question-panel,
      .penalty-panel {
        padding: 16px;
        border-radius: 18px;
      }

      .penalty-panel {
        min-height: 390px;
      }

      .field {
        height: 315px;
      }

      .goal-frame {
        width: 82%;
        height: 118px;
        top: 30px;
      }

      .goal-line {
        top: 148px;
        left: 9%;
        width: 82%;
      }

      .keeper {
        top: 119px;
        width: 64px;
        height: 82px;
      }

      .ball {
        width: 50px;
        height: 50px;
        margin-left: -25px;
        bottom: 24px;
      }

      .answer-btn {
        font-size: 15px;
        padding: 14px;
      }

      .result-banner {
        top: 54px;
        font-size: 32px;
        padding: 10px 18px;
      }

      @keyframes ballGoal {
        0% {
          left: 50%;
          bottom: 24px;
          transform: scale(1) rotate(0deg);
        }
        65% {
          left: 65%;
          bottom: 168px;
          transform: scale(0.78) rotate(540deg);
        }
        100% {
          left: 69%;
          bottom: 202px;
          transform: scale(0.58) rotate(900deg);
        }
      }

      @keyframes ballSave {
        0% {
          left: 50%;
          bottom: 24px;
          transform: scale(1) rotate(0deg);
        }
        72% {
          left: 50%;
          bottom: 140px;
          transform: scale(0.82) rotate(520deg);
        }
        100% {
          left: 50%;
          bottom: 130px;
          transform: scale(0.82) rotate(580deg);
        }
      }

      @keyframes ballMiss {
        0% {
          left: 50%;
          bottom: 24px;
          transform: scale(1) rotate(0deg);
        }
        70% {
          left: 90%;
          bottom: 178px;
          transform: scale(0.75) rotate(560deg);
        }
        100% {
          left: 111%;
          bottom: 215px;
          transform: scale(0.62) rotate(900deg);
        }
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header class="header">
      <div class="brand">
        <h1>Yanmar Quiz Arena</h1>
        <p>Answer correctly to score a penalty.</p>
      </div>

      <div class="scoreboard">
        <div class="score-card">
          <strong id="score">0</strong>
          <span>Goals</span>
        </div>
        <div class="score-card">
          <strong id="questionNumber">1/6</strong>
          <span>Question</span>
        </div>
      </div>
    </header>

    <section id="gameContent" class="content">
      <div class="question-panel">
        <div class="question-count" id="questionCount">Question 1</div>
        <h2 class="question" id="questionText"></h2>
        <div class="answers" id="answers"></div>

        <div class="meta">
          <div class="status" id="statusText">Choose your answer.</div>
          <button class="next-btn" id="nextBtn">Next question</button>
        </div>
      </div>

      <div class="penalty-panel">
        <div class="arena-title">
          <span>Penalty Arena</span>
          <span>Team Yanmar</span>
        </div>

        <div class="result-banner" id="resultBanner">GOAL!</div>

        <div class="confetti" id="confetti">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>

        <div class="field">
          <div class="net-label">NET</div>
          <div class="goal-frame" id="goalFrame"></div>
          <div class="goal-line"></div>

          <div class="keeper" id="keeper">
            <div class="head"></div>
            <div class="body"></div>
            <div class="legs"></div>
          </div>

          <div class="shot-line" id="shotLine"></div>
          <div class="ball" id="ball"></div>
        </div>
      </div>
    </section>

    <section class="final-screen" id="finalScreen">
      <h2>Full Time</h2>
      <p id="finalText"></p>
      <button class="restart-btn show" id="restartBtn">Play again</button>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Which logo mark is associated with Yanmar?",
        answers: ["Flying Y", "Target symbol", "Mitsubishi diamonds"],
        correct: 0
      },
      {
        question: "What does Yanmar produce?",
        answers: ["Engines, generators, pumps and machinery", "Only smartphones", "Only clothing"],
        correct: 0
      },
      {
        question: "Which color is strongly linked to Yanmar branding?",
        answers: ["Premium Red", "Neon Purple", "Pastel Pink"],
        correct: 0
      },
      {
        question: "What is an Oniyanma?",
        answers: ["A dragonfly", "A mountain", "A football club"],
        correct: 0
      },
      {
        question: "In which Japanese city was Yanmar founded?",
        answers: ["Osaka", "Paris", "New York"],
        correct: 0
      },
      {
        question: "Which clubs connect Yanmar with football?",
        answers: ["Almere City FC and Cerezo Osaka", "Real Madrid and Chelsea", "Ajax and Barcelona"],
        correct: 0
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionText = document.getElementById("questionText");
    const questionCount = document.getElementById("questionCount");
    const questionNumber = document.getElementById("questionNumber");
    const answersEl = document.getElementById("answers");
    const scoreEl = document.getElementById("score");
    const statusText = document.getElementById("statusText");
    const nextBtn = document.getElementById("nextBtn");

    const ball = document.getElementById("ball");
    const keeper = document.getElementById("keeper");
    const goalFrame = document.getElementById("goalFrame");
    const shotLine = document.getElementById("shotLine");
    const resultBanner = document.getElementById("resultBanner");
    const confetti = document.getElementById("confetti");

    const gameContent = document.getElementById("gameContent");
    const finalScreen = document.getElementById("finalScreen");
    const finalText = document.getElementById("finalText");
    const restartBtn = document.getElementById("restartBtn");

    function shuffleAnswers(question) {
      const mapped = question.answers.map((answer, index) => ({
        answer,
        isCorrect: index === question.correct
      }));

      for (let i = mapped.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [mapped[i], mapped[j]] = [mapped[j], mapped[i]];
      }

      return mapped;
    }

    function loadQuestion() {
      answered = false;
      resetPenaltyAnimation();

      const q = questions[currentQuestion];
      questionText.textContent = q.question;
      questionCount.textContent = `Question ${currentQuestion + 1}`;
      questionNumber.textContent = `${currentQuestion + 1}/${questions.length}`;
      statusText.textContent = "Choose your answer.";
      statusText.className = "status";
      nextBtn.classList.remove("show");

      answersEl.innerHTML = "";

      const shuffledAnswers = shuffleAnswers(q);

      shuffledAnswers.forEach((item) => {
        const button = document.createElement("button");
        button.className = "answer-btn";
        button.textContent = item.answer;

        button.addEventListener("click", () => {
          handleAnswer(button, item.isCorrect);
        });

        answersEl.appendChild(button);
      });
    }

    function handleAnswer(selectedButton, isCorrect) {
      if (answered) return;
      answered = true;

      const buttons = document.querySelectorAll(".answer-btn");
      buttons.forEach((button) => {
        button.disabled = true;
      });

      if (isCorrect) {
        score++;
        scoreEl.textContent = score;
        selectedButton.classList.add("correct");
        statusText.textContent = "Correct answer. GOAL!";
        statusText.className = "status goal";
        playShot("goal");
      } else {
        selectedButton.classList.add("wrong");

        buttons.forEach((button) => {
          const q = questions[currentQuestion];
          if (button.textContent === q.answers[q.correct]) {
            button.classList.add("correct");
          }
        });

        const wrongOutcome = Math.random() > 0.5 ? "save" : "miss";
        statusText.textContent = wrongOutcome === "save"
          ? "Wrong answer. SAVED by the keeper!"
          : "Wrong answer. MISS!";
        statusText.className = `status ${wrongOutcome}`;
        playShot(wrongOutcome);
      }

      setTimeout(() => {
        nextBtn.classList.add("show");
      }, 1100);
    }

    function playShot(outcome) {
      resetPenaltyAnimation();

      void ball.offsetWidth;

      ball.classList.add(outcome);
      shotLine.classList.add(outcome);
      resultBanner.classList.add("show", outcome);

      if (outcome === "goal") {
        resultBanner.textContent = "GOAL!";
        goalFrame.classList.add("net-shake");
        keeper.classList.add("dive-left");
        confetti.classList.add("show");
      }

      if (outcome === "save") {
        resultBanner.textContent = "SAVED!";
        keeper.classList.add("save-center");
      }

      if (outcome === "miss") {
        resultBanner.textContent = "MISS!";
        keeper.classList.add("dive-left");
      }
    }

    function resetPenaltyAnimation() {
      ball.className = "ball";
      keeper.className = "keeper";
      goalFrame.className = "goal-frame";
      shotLine.className = "shot-line";
      resultBanner.className = "result-banner";
      confetti.className = "confetti";
      resultBanner.textContent = "";
    }

    function nextQuestion() {
      currentQuestion++;

      if (currentQuestion >= questions.length) {
        showFinalScreen();
      } else {
        loadQuestion();
      }
    }

    function showFinalScreen() {
      gameContent.classList.add("hidden");
      finalScreen.classList.add("show");
      finalText.textContent = `You scored ${score} out of ${questions.length} penalties.`;
    }

    function restartGame() {
      currentQuestion = 0;
      score = 0;
      scoreEl.textContent = score;
      gameContent.classList.remove("hidden");
      finalScreen.classList.remove("show");
      loadQuestion();
    }

    nextBtn.addEventListener("click", nextQuestion);
    restartBtn.addEventListener("click", restartGame);

    loadQuestion();
  </script>
</body>
</html>
